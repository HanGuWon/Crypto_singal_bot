name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Import smoke
        run: python -c "import crypto_signal_bot.cli"
      - name: Pytest
        run: python -m pytest
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src
